map $http_upgrade $connection_upgrade { default upgrade; '' close; }
limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;
server {
 listen 80;
 root /usr/share/nginx/html;
 server_tokens off;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Permissions-Policy "camera=(), microphone=(self)" always;
 location = /api/auth { limit_req zone=auth burst=20 nodelay; proxy_pass http://backend:8080; }
 location /api/ { proxy_pass http://backend:8080; proxy_read_timeout 30s; }
 location /api/admin/ { deny all; }
 location /ws { proxy_pass http://backend:8080; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; access_log off; }
 location /livekit/ { proxy_pass http://livekit:7880/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection $connection_upgrade; proxy_read_timeout 75s; access_log off; }
 location = /health { proxy_pass http://backend:8080/actuator/health; }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; }
 location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
